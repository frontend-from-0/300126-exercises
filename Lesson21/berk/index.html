<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Validation</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <div class="form-wrapper">
        <h1>Checkout</h1>
        <form novalidate id="checkoutForm" method="post">
          <div class="input-group">
            <label for="email">Email</label>
            <input
              id="email"
              type="email"
              placeholder="email@example.com"
              autocomplete="email"
              name="email"
              aria-describedby="emailError"
            />
            <p
              id="emailError"
              class="input-error hidden"
              aria-live="polite"
            ></p>
          </div>
          <div class="input-group">
            <label for="phone">Phone</label>
            <input
              id="phone"
              type="tel"
              placeholder="555 123 4567"
              autocomplete="tel"
              name="phoneNumber"
              aria-describedby="phoneError"
            />
            <p
              id="phoneError"
              class="input-error hidden"
              aria-live="polite"
            ></p>
          </div>
          <div class="input-group">
            <label for="firstName">First Name</label>
            <input
              id="firstName"
              type="text"
              placeholder="Sophia"
              name="firstName"
              aria-describedby="firstNameError"
              autocomplete="given-name"
            />
            <p
              id="firstNameError"
              class="input-error hidden"
              aria-live="polite"
            ></p>
          </div>
          <div class="input-group">
            <label for="lastName">Last Name</label>
            <input
              id="lastName"
              type="text"
              placeholder="Clark"
              name="lastName"
              autocomplete="family-name"
              aria-describedby="lastNameError"
            />
            <p
              id="lastNameError"
              class="input-error hidden"
              aria-live="polite"
            ></p>
          </div>

          <div class="input-group">
            <label for="cardNumber">Card Number</label>
            <input
              id="cardNumber"
              type="text"
              placeholder="1234 5678 9101 1121"
              name="cardNumber"
              autocomplete="cc-number"
              inputmode="numeric"
              aria-describedby="cardError"
            />
            <p id="cardError" class="input-error hidden" aria-live="polite"></p>
          </div>
          <div class="input-group">
            <label for="expDate">Expiration Date</label>
            <input
              id="expDate"
              type="text"
              placeholder="MM/YY"
              name="expDate"
              aria-describedby="expDateError"
            />
            <p
              id="expDateError"
              class="input-error hidden"
              aria-live="polite"
            ></p>
          </div>
          <div class="input-group">
            <label for="cvv">CVV</label>
            <input
              id="cvv"
              type="text"
              placeholder="123"
              name="cvv"
              aria-describedby="cvvError"
            />
            <p id="cvvError" class="input-error hidden" aria-live="polite"></p>
          </div>
          <button type="submit" class="btn-success">Place Order</button>
        </form>
        <div
          class="confirmation-box hidden"
          id="confirmationMessage"
          role="status"
          aria-live="polite"
        >
          <h3>Payment received.</h3>
          <p id="confirmationText"></p>
        </div>
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
