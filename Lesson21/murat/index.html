<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Validation</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <form novalidate id="checkoutForm" method="post">
        <div class="input-group">
          <label for="email">Email</label>
          <input
            class="form-input"
            id="email"
            type="email"
            placeholder="email@example.com"
            name="email"
            aria-describedby="emailError"
          />
          <p id="emailError" class="input-error hidden" aria-live="polite"></p>
        </div>
        <div class="input-group">
          <label for="phone">Phone</label>
          <input
            class="form-input"
            id="phone"
            type="tel"
            placeholder="555 123 4567"
            name="phoneNumber"
            aria-describedby="phoneError"
          />
          <p id="phoneError" class="input-error hidden" aria-live="polite"></p>
        </div>
        <div class="input-group">
          <label for="firstname">First Name</label>
          <input
            class="form-input"
            id="firstname"
            type="text"
            placeholder="Sophia"
            name="firstname"
            aria-describedby="firstNameError"
          />
          <p
            id="firstNameError"
            class="input-error hidden"
            aria-live="polite"
          ></p>
        </div>
        <div class="input-group">
          <label for="lastname">Last Name</label>
          <input
            class="form-input"
            id="lastname"
            type="text"
            placeholder="Clark"
            name="lastname"
            aria-describedby="lastNameError"
          />
          <p
            id="lastNameError"
            class="input-error hidden"
            aria-live="polite"
          ></p>
        </div>

        <div class="input-group">
          <label for="cardnumber">Card Number</label>
          <input
            class="form-input"
            id="cardnumber"
            type="text"
            placeholder="1234 5678 9101 1121"
            name="cardnumber"
            aria-describedby="cardError"
          />
          <p id="cardError" class="input-error hidden" aria-live="polite"></p>
        </div>
        <div class="input-group">
          <label for="expDate">Expiration Date</label>
          <input
            class="form-input"
            id="expDate"
            type="text"
            placeholder="MM/YY"
            name="expDate"
            aria-describedby="dateError"
          />
          <p id="dateError" class="input-error hidden" aria-live="polite"></p>
        </div>

        <div class="input-group">
          <label for="cvv">CVV</label>
          <input
            class="form-input"
            id="cvv"
            type="text"
            placeholder="123"
            name="cvv"
            aria-describedby="cvvError"
          />
          <p id="cvvError" class="input-error hidden" aria-live="polite"></p>
        </div>

        <button type="submit" class="btn-success">Place Order</button>
      </form>
      <div class="hidden success">
        <p>Congratulations! The form has been successfully submitted.</p>
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
