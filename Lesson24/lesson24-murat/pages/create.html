<!doctype html>
<html>
  <head>
    <title>Create User</title>
    <link rel="stylesheet" type="text/css" href="../styles.css" />
  </head>
  <body>
    <main class="container">
      <form id="createUserForm" class="card">
        <h1 style="margin-bottom: var(--space-md); text-align: left">
          Create User
        </h1>

        <div class="form-group">
          <label for="firstName">First Name:</label>
          <input
            type="text"
            name="firstName"
            id="firstName"
            class="input"
            required
          />
        </div>

        <div class="form-group">
          <label for="lastName">Last Name:</label>
          <input
            type="text"
            name="lastName"
            id="lastName"
            class="input"
            required
          />
        </div>

        <div class="card-actions">
          <button type="submit" class="button button--success">
            Create User
          </button>
          <a href="../index.html" class="button">Cancel</a>
        </div>
      </form>

      <div>
        <p class="hidden" id="statusMessage"></p>
      </div>
    </main>

    <script src="./create.js"></script>
  </body>
</html>
