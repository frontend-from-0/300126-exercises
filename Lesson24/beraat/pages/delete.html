<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delete User</title>
    <link rel="stylesheet" type="text/css" href="../styles.css" />
  </head>

  <body>
    <main class="page">
      <h1 class="page-title">Delete User</h1>

      <p class="status-message hidden" id="statusMessage" role="status" aria-live="polite"></p>
      <div class="card confirmation-card" id="confirmationMessage">
        <h2 class="section-title">
          Are you sure you want to delete this user?
        </h2>

        <div class="user-details" id="userDetails"></div>

        <div class="form-buttons">
          <button
            type="button"
            id="confirmDeleteButton"
            class="button button--danger"
          >
            Yes, Delete User
          </button>

          <a href="#" id="cancelDeleteButton" class="button"> No, Go Back </a>
        </div>
      </div>

      <div class="card success-card hidden" id="successMessage">
        <h2 class="success-title">User Deleted Successfully!</h2>

        <p class="success-text">The user has been deleted.</p>

        <a href="../index.html" class="button"> Return to Home </a>
      </div>
    </main>

    <script src="../app.js"></script>
  </body>
</html>
