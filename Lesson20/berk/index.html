<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Appointment Booking</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container" id="form-content">
      <header>
        <h1>Book an Appointment</h1>
      </header>

      <form class="booking" id="booking-form">
        <section class="calendar">
          <fieldset class="personal-info-container">
            <legend class="info-heading">Personal Information</legend>
            <div class="form-fields">
              <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input
                  class="personal-info"
                  id="username"
                  type="text"
                  name="username"
                  placeholder="Enter your name"
                />
                <label class="form-label" for="email">Email</label>
                <input
                  class="personal-info"
                  type="email"
                  id="email"
                  name="userEmail"
                  placeholder="example@gmail.com"
                />
              </div>
            </div>
          </fieldset>
          <label class="form-label" for="date">Select a date</label>
          <input class="personal-info" type="date" id="date" />
          <legend class="info-heading" id="timeslots-heading">
            Available Time Slots
          </legend>
          <fieldset class="timeslots" aria-labelledby="timeslots-heading">
            <legend class="hidden">Choose a time slot</legend>
            <input
              class="slot"
              type="radio"
              id="time-0900"
              name="time"
              value="09:00"
            />
            <label class="radio-button" for="time-0900">09:00</label>

            <input
              class="slot"
              type="radio"
              id="time-0930"
              name="time"
              value="09:30"
            />
            <label class="radio-button" for="time-0930">09:30</label>
            <input
              class="slot"
              type="radio"
              id="time-1000"
              name="time"
              value="10:00"
            />
            <label class="radio-button" for="time-1000">10:00</label>
            <input
              class="slot"
              type="radio"
              id="time-1030"
              name="time"
              value="10:30"
            />
            <label class="radio-button" for="time-1030">10:30</label>
            <input
              class="slot"
              type="radio"
              id="time-1100"
              name="time"
              value="11:00"
            />
            <label class="radio-button" for="time-1100">11:00</label>
          </fieldset>
        </section>

        <aside class="summary">
          <h2>Your Appointment</h2>
          <p>Username: <span id="selected-username">-</span></p>
          <p>Email: <span id="selected-email">-</span></p>
          <p>Date: <span id="selected-date">-</span></p>
          <p>Time: <span id="selected-time">-</span></p>
          <button id="confirm" disabled>Confirm Booking</button>
        </aside>
      </form>
    </div>

    <div class="container hidden" id="confirmation-message">
      <header>
        <h1>Your appointment is confirmed</h1>
      </header>
    </div>

    <script src="script.js"></script>
  </body>
</html>
