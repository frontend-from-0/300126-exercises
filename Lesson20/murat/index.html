<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Appointment Booking</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container" id="form-content">
      <header>
        <h1>Book an Appointment</h1>
      </header>

      <form class="booking" id="booking-form">
        <section class="calendar">
          <label for="date">Select a date</label>
          <input type="date" id="date" />
          <h2 id="timeslots-heading">Available Time Slots</h2>
          <fieldset class="timeslots" aria-labelledby="timeslots-heading">
            <legend class="hidden">Choose a time slot</legend>

            <!-- 09:00 -->
            <input
              type="radio"
              id="slot-0900"
              name="timeslot"
              value="09:00"
              class="slot-input"
            />
            <label for="slot-0900" class="slot">09:00</label>

            <!-- 10:30 -->
            <input
              type="radio"
              id="slot-1030"
              name="timeslot"
              value="10:30"
              class="slot-input"
            />
            <label for="slot-1030" class="slot">10:30</label>

            <!-- 13:00 -->
            <input
              type="radio"
              id="slot-1300"
              name="timeslot"
              value="13:00"
              class="slot-input"
            />
            <label for="slot-1300" class="slot">13:00</label>

            <!-- 14:30 -->
            <input
              type="radio"
              id="slot-1430"
              name="timeslot"
              value="14:30"
              class="slot-input"
            />
            <label for="slot-1430" class="slot">14:30</label>
          </fieldset>
        </section>

        <aside class="summary">
          <h2>Your Appointment</h2>
          <p>Name: <span id="display-username">-</span></p>
          <p>Email: <span id="display-email">-</span></p>
          <p>Date: <span id="selected-date">-</span></p>
          <p>Time: <span id="selected-time">-</span></p>
          <button id="confirm" disabled>Confirm Booking</button>
        </aside>
      </form>
    </div>

    <div class="container hidden" id="confirmation-message">
      <header>
        <h1>Booking Confirmed</h1>
      </header>
    </div>

    <div id="login-page" class="page-login">
      <div class="login-container">
        <h2>Welcome to the appointment page</h2>
        <p>Please write your information for access to booking page</p>

        <form action="" id="login-form">
          <div class="input-group">
            <label for="username" class="input-label">User Name</label>
            <input
              type="text"
              id="username"
              required
              placeholder="Name and Last Name"
              class="input-form"
            />
          </div>

          <div class="input-group">
            <label for="email" class="input-label">Email</label>
            <input
              type="email"
              id="email"
              required
              placeholder="forexample@mail.com"
              class="input-form"
            />
          </div>
          <button type="submit" class="submit-btn">Save</button>
        </form>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
