<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posts Homework - Gelişmiş</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
    }
    #posts-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 25px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .post-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease-in-out;
    }
    .post-card:hover {
      transform: translateY(-5px);
    }
    .post-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-bottom: 1px solid #e0e0e0;
    }
    .post-card-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .post-card h2 {
      font-size: 1.3rem;
      color: #333;
      margin-top: 0;
      margin-bottom: 10px;
      text-transform: capitalize;
    }
    .post-card p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  
  <h1 style="text-align: center; color: #333; margin-bottom: 30px;">Gönderiler</h1>
  
  <div id="posts-container"></div>

  <!-- JavaScript kodlarını HTML içine aldık, böylece yol hatası riski kalmadı -->
  <script>
    const postsContainer = document.getElementById('posts-container');

    fetch('https://jsonplaceholder.typicode.com/posts')
      .then((response) => response.json())
      .then((posts) => {
        // Çok uzun olmasın diye sadece ilk 12 gönderiyi alıyoruz (isteğe bağlı)
        const limitedPosts = posts.slice(0, 12);
        
        limitedPosts.forEach((post) => {
          const card = document.createElement('div');
          card.classList.add('post-card');

          const image = document.createElement('img');
          image.src = `https://picsum.photos/400/200?random=${post.id}`;
          image.alt = post.title;

          const content = document.createElement('div');
          content.classList.add('post-card-content');

          const title = document.createElement('h2');
          title.textContent = post.title;

          const body = document.createElement('p');
          body.textContent = post.body;

          content.appendChild(title);
          content.appendChild(body);

          card.appendChild(image);
          card.appendChild(content);

          postsContainer.appendChild(card);
        });
      })
      .catch((error) => console.log('Hata:', error));
  </script>
</body>
</html>
